[workspace]
resolver = "2"
members = [
  "crates/sim-types",
  "crates/sim-rng",
  "crates/sim-params",
  "crates/sim-model",
  "crates/sim-metrics",
  "crates/sim-checks",
  "crates/sim-engine",
  "crates/sim-api",
  "crates/sim-wasm",
  "crates/sim-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libm = "0.2"
clap = { version = "4", features = ["derive"] }
insta = { version = "1", features = ["json"] }
proptest = "1"
sim-types = { path = "crates/sim-types" }
sim-rng = { path = "crates/sim-rng" }
sim-params = { path = "crates/sim-params" }
sim-model = { path = "crates/sim-model" }
sim-metrics = { path = "crates/sim-metrics" }
sim-checks = { path = "crates/sim-checks" }
sim-engine = { path = "crates/sim-engine" }
sim-api = { path = "crates/sim-api" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Size-tuned profile for the browser build only (`npm run build:wasm`). The native release
# profile is untouched, so the tuning CLI keeps its speed. The model uses no fast-math and only
# libm transcendentals, so results do not depend on the optimisation level; the native golden
# and the wasm golden test both guard that.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# Debug builds of the simulation crates are optimised so the scenario suites run fast
# (`cargo test --workspace` was ~4 min at opt-level 0). Overflow checks and debug assertions stay on,
# and the model uses no fast-math, so results are unchanged (the statehash example and goldens guard that).
[profile.dev.package.sim-types]
opt-level = 2
[profile.dev.package.sim-rng]
opt-level = 2
[profile.dev.package.sim-params]
opt-level = 2
[profile.dev.package.sim-metrics]
opt-level = 2
[profile.dev.package.sim-model]
opt-level = 2
[profile.dev.package.sim-engine]
opt-level = 2
[profile.dev.package.sim-checks]
opt-level = 2
[profile.dev.package.libm]
opt-level = 2
